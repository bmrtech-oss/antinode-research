name: Publish book

on:
  push:
    branches: [main]
    paths:
      - "002-from-noise-to-knowing/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "002-from-noise-to-knowing/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material "mkdocs<2"
      - name: Check generated navigation is up to date
        run: |
          python 002-from-noise-to-knowing/tools/build_index.py
          python 002-from-noise-to-knowing/tools/build_book.py
          python 002-from-noise-to-knowing/tools/chapter_meta.py
          python 002-from-noise-to-knowing/tools/diagram_alt.py apply
          git diff --exit-code -- 002-from-noise-to-knowing
      - name: Check links and chapter references
        run: python 002-from-noise-to-knowing/tools/check_links.py
      - run: mkdocs build --strict -f 002-from-noise-to-knowing/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
