stages:
  - validate-markdown
  - validate-diagrams
  - validate-structure
  - validate-links

validate-markdown:
  stage: validate-markdown
  image: node:22-alpine
  script:
    - npx --yes markdownlint-cli2 "**/*.md"

validate-diagrams:
  stage: validate-diagrams
  image: minlag/mermaid-cli:latest
  script:
    - mkdir -p /tmp/mermaid-output
    - for diagram in $(find . -name '*.mmd' -not -path './.git/*'); do mmdc -i "$diagram" -o "/tmp/mermaid-output/$(basename "$diagram").svg"; done

validate-structure:
  stage: validate-structure
  image: alpine:3.20
  script:
    - test -f README.md && test -f CONTRIBUTING.md && test -f LICENSE && test -f SECURITY.md && test -f CITATION.cff && test -f .gitignore
    - test -d templates/paper-template && test -d templates/adr-template
    - test -d 001-aidlc-business-rule-extraction/paper && test -d 001-aidlc-business-rule-extraction/diagrams && test -d 001-aidlc-business-rule-extraction/artifact && test -d 001-aidlc-business-rule-extraction/adr
    - test -f shared/principles.md && test -f shared/glossary.md && test -f shared/style-guide.md && test -f shared/references.bib
    - for decision in property-graph-over-rdf yaml-taxonomy-over-ontology single-tenant-over-multi-tenant cue-pkl-schema-validation system-1-system-2-model incremental-ingestion-provenance hybrid-repo-structure phased-delivery-hard-gates; do test -f "001-aidlc-business-rule-extraction/adr/$decision.md"; done

validate-links:
  stage: validate-links
  image: node:22-alpine
  script:
    - find . -name '*.md' -not -path './.git/*' -print0 | xargs -0 npx --yes markdown-link-check --config .markdown-link-check.json
